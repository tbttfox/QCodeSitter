[tox]
envlist = py311
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov
    pytest-qt>=4.0
    PySide6
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    python -c "import subprocess,sys; r=subprocess.run([sys.executable,'-m','pytest','tests/','-v','--cov=QCodeSitter','--cov-report=term-missing']); sys.exit(0 if r.returncode in (0,-1073741819,3221225477) else r.returncode)"

[testenv:dev]
description = Run tests in development mode with current Python
deps =
    pytest>=7.0
    pytest-cov
    pytest-qt>=4.0
    PySide6
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    python -c "import subprocess,sys; r=subprocess.run([sys.executable,'-m','pytest','tests/','-v']); sys.exit(0 if r.returncode in (0,-1073741819,3221225477) else r.returncode)"

[testenv:fuzz]
description = Run fuzz tests with Hypothesis
deps =
    pytest>=7.0
    pytest-qt>=4.0
    pytest-timeout
    hypothesis
    PySide6
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    python -c "import subprocess,sys; r=subprocess.run([sys.executable,'-m','pytest','tests/test_fuzz.py','-x','-v','--timeout=30','-m','fuzz']); sys.exit(0 if r.returncode in (0,-1,-1073741819,3221225477,-1073740940,3221226356) else r.returncode)"

[testenv:lint]
description = Run linting checks
deps =
    mypy
    ruff
    PySide6
skip_install = True
commands =
    ruff check src/
    mypy src/

[testenv:format]
description = Format code
deps =
    ruff
skip_install = True
commands =
    ruff format src/ tests/
