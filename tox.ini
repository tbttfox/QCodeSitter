[tox]
envlist = py311, pyqt6
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov
    pytest-qt>=4.0
    PySide6
extras = preditor
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    pytest tests/ -v --cov=QCodeSitter --cov-report=term-missing

[testenv:dev]
description = Run tests in development mode with current Python
deps =
    pytest>=7.0
    pytest-cov
    pytest-qt>=4.0
    PySide6
extras = preditor
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    pytest tests/ -v

[testenv:pyqt6]
description = Run the tests on PyQt6
deps =
    pytest>=7.0
    pytest-qt>=4.0
    PyQt6
extras = preditor
setenv =
    QT_QPA_PLATFORM = offscreen
    QT_PREFERRED_BINDING = PyQt6
    PYTEST_QT_API = pyqt6
commands =
    pytest tests/ -v

[testenv:fuzz]
description = Run fuzz tests with Hypothesis
deps =
    pytest>=7.0
    pytest-qt>=4.0
    pytest-timeout
    hypothesis
    PySide6
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    pytest tests/fuzz -x -v --timeout=30 -m fuzz

[testenv:lint]
description = Run linting checks
deps =
    mypy
    ruff
    PySide6
skip_install = True
commands =
    ruff check src/
    mypy src/

[testenv:format]
description = Format code
deps =
    ruff
skip_install = True
commands =
    ruff format src/ tests/
