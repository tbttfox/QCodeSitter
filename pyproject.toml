[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QCodeSitter"
version = "0.1.0"
description = "Dynamic sequence with efficient cumulative sums"
requires-python = ">=3.8"
dependencies = ["Qt.py", "stransi", "tree-sitter==0.25.2", "tree-sitter-python"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov", "pytest-qt>=4.0"]
fuzz = ["pytest>=7.0", "pytest-qt>=4.0", "pytest-timeout", "hypothesis"]
dev = ["tox>=4.0", "mypy", "ruff"]

[project.entry-points."preditor.plug.editors"]
QCodeSitter = "QCodeSitter.entry_points.preditor_interface:CodeSitterTextEdit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --ignore=tests/test_fuzz.py"
markers = [
    "fuzz: slow fuzz tests (run with: tox -e fuzz)",
]
