[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "QCodeSitter"
dynamic = ["version"]  # from the git tag, via setuptools-scm
description = "A tree-sitter powered code editor widget for Qt"
requires-python = ">=3.10"
# Qt.py needs a Qt binding: install one yourself, or use the pyside6 extra.
# The grammar has to be built for an ABI that the tree-sitter core can load
dependencies = [
    "Qt.py>=2.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.23,<0.26",
]
authors = [
  { name="Tyler Fox", email="tyler@blur.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


[project.optional-dependencies]
pyside6 = ["PySide6"]
test = ["pytest>=7.0", "pytest-cov", "pytest-qt>=4.0", "PySide6"]
fuzz = ["pytest>=7.0", "pytest-qt>=4.0", "pytest-timeout", "hypothesis", "PySide6"]
dev = ["tox>=4.0", "mypy", "ruff"]
preditor = ["preditor"]

[project.entry-points."preditor.plug.editors"]
QCodeSitter = "QCodeSitter.integrations.preditor_interface:CodeSitterTextEdit"

[project.urls]
Homepage = "https://github.com/tbttfox/qcodesitter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
QCodeSitter = ["py.typed"]

[tool.setuptools_scm]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# PrEditor ships no stubs or py.typed marker
module = ["preditor.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --ignore=tests/fuzz"
markers = [
    "fuzz: slow fuzz tests (run with: tox -e fuzz)",
]

[tool.ruff.lint]
ignore = ["SIM", "RUF012", "N999"]
